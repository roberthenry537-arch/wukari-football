{% extends 'players/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="mb-3">Submit Squad for {{ tournament.name }}</h3>
                <p class="text-muted">Club: <strong>{{ club.name }}</strong></p>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Select Players (Maximum 22)</label>
                        {% for player in players %}
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="players" value="{{ player.id }}"
                                   id="player{{ player.id }}"
                                   {% if player in squad.players.all %}checked{% endif %}>
                            <label class="form-check-label" for="player{{ player.id }}">
                                {{ player.full_name }} ({{ player.get_position_display }})
                            </label>
                        </div>
                        {% empty %}
                        <p class="text-muted">No players found in this club.</p>
                        {% endfor %}
                    </div>
                    <button type="submit" class="btn btn-success">Submit Squad</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
